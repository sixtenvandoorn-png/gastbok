<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gästbok</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; background: #f5f5f5; }
    form, .entry { background: #fff; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    input, textarea { width: 100%; box-sizing: border-box; padding: .5rem; margin: .25rem 0 .75rem; font: inherit; }
    button { padding: .5rem 1.25rem; cursor: pointer; }
    .entry-head { display: flex; justify-content: space-between; color: #333; }
    .time { color: #888; font-size: .85rem; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Gästbok</h1>
  {{error}}
  <form action="/save" method="post">
    <label>Namn
      <input type="text" name="name" maxlength="50" required>
    </label>
    <label>Meddelande
      <textarea name="message" rows="4" maxlength="1000" required></textarea>
    </label>
    <button type="submit">Skriv i gästboken</button>
  </form>

  <h2>Inlägg</h2>
  {{entries}}
</body>
</html>
